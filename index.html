<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Dopahar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a12;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas#scene {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      /* --- Loading / tap-to-start overlay --- */
      #start-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: radial-gradient(ellipse at 50% 40%, #4a2e18 0%, #2a1810 60%, #1a0f0a 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #f8ead0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        text-align: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #start-overlay .title-hi {
        font-family: 'Noto Sans Devanagari', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 3rem;
        line-height: 1.2;
        margin: 0;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      #start-overlay .title-en {
        font-size: 1rem;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        opacity: 0.75;
        margin: 0.4rem 0 2.2rem;
        font-weight: 500;
      }
      #progress-track {
        width: 200px;
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.15);
        overflow: hidden;
      }
      #progress-fill {
        width: 0%;
        height: 100%;
        background: #f2b25c;
        transition: width 0.15s ease-out;
      }
      #start-overlay.hidden {
        display: none;
      }
      #start-overlay-hint {
        opacity: 0.85;
        font-size: 0.95rem;
        margin: 1.4rem 0 0;
        display: none;
      }
      #start-overlay.ready #progress-track {
        display: none;
      }
      #start-overlay.ready #start-overlay-hint {
        display: block;
      }

      /* --- FPS counter (dev flag only) --- */
      #fps-counter {
        position: fixed;
        top: calc(8px + env(safe-area-inset-top));
        left: calc(8px + env(safe-area-inset-left));
        z-index: 50;
        color: #9ee39e;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 12px;
        background: rgba(0, 0, 0, 0.4);
        padding: 4px 8px;
        border-radius: 4px;
        pointer-events: none;
        display: none;
      }

      /* --- Touch controls --- */
      #touch-controls {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: none;
        pointer-events: none;
      }
      #touch-controls.active {
        display: block;
      }
      #joystick-zone {
        position: absolute;
        left: calc(16px + env(safe-area-inset-left));
        bottom: calc(24px + env(safe-area-inset-bottom));
        width: 140px;
        height: 140px;
        pointer-events: auto;
      }
      #joystick-base {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        border: 2px solid rgba(255, 255, 255, 0.25);
      }
      #joystick-knob {
        position: absolute;
        width: 56px;
        height: 56px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.35);
      }
      #look-zone {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 50%;
        pointer-events: auto;
      }
      #interact-button {
        position: absolute;
        right: calc(20px + env(safe-area-inset-right));
        bottom: calc(24px + env(safe-area-inset-bottom));
        width: 68px;
        height: 68px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.22);
        border: 2px solid rgba(255, 255, 255, 0.4);
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 13px;
        font-weight: 600;
        display: none;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
      }
      #interact-button.active {
        display: flex;
      }

      /* --- Objective (item 3) --- */
      #objective-panel {
        position: fixed;
        top: calc(14px + env(safe-area-inset-top));
        left: calc(14px + env(safe-area-inset-left));
        z-index: 45;
        max-width: min(62vw, 380px);
        background: rgba(20, 14, 10, 0.5);
        border-radius: 10px;
        padding: 8px 14px;
        color: #f8ead0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        pointer-events: none;
        display: none;
      }
      #objective-panel.visible {
        display: block;
      }
      #objective-hi {
        font-family: 'Noto Sans Devanagari', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 1.05rem;
        font-weight: 700;
        margin: 0;
        line-height: 1.3;
      }
      #objective-en {
        font-size: 0.68rem;
        opacity: 0.75;
        margin: 2px 0 0;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-weight: 500;
      }

      /* --- End card (item 3) --- */
      #end-card {
        position: fixed;
        inset: 0;
        z-index: 110;
        background: radial-gradient(ellipse at 50% 40%, #4a2e18 0%, #2a1810 60%, #1a0f0a 100%);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #f8ead0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        text-align: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #end-card.visible {
        display: flex;
      }
      #end-card .end-hi {
        font-family: 'Noto Sans Devanagari', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 2.2rem;
        line-height: 1.3;
        margin: 0;
        font-weight: 700;
      }
      #end-card .end-en {
        font-size: 0.95rem;
        opacity: 0.8;
        margin: 0.5rem 0 2rem;
        font-weight: 500;
      }
      #play-again-btn {
        font-family: inherit;
        font-size: 0.95rem;
        font-weight: 600;
        color: #2a1810;
        background: #f2b25c;
        border: none;
        border-radius: 24px;
        padding: 12px 28px;
        cursor: pointer;
      }

      /* --- Dialogue / message panel (item 2) --- */
      #dialogue-panel {
        position: fixed;
        left: 50%;
        bottom: calc(20px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 60;
        width: min(560px, calc(100% - 32px));
        background: rgba(20, 14, 10, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 16px 20px 12px;
        color: #f8ead0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: none;
        cursor: pointer;
        pointer-events: auto;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
      }
      #dialogue-panel.visible {
        display: block;
      }
      #dialogue-hi {
        font-family: 'Noto Sans Devanagari', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 1.25rem;
        font-weight: 700;
        line-height: 1.45;
        margin: 0 0 4px;
      }
      #dialogue-en {
        font-size: 0.82rem;
        line-height: 1.35;
        opacity: 0.75;
        margin: 0;
        font-weight: 500;
      }
      #dialogue-hint {
        text-align: right;
        font-size: 0.65rem;
        opacity: 0.45;
        margin: 8px 0 0;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      /* --- Mount/dismount prompt --- */
      #interact-hint {
        position: fixed;
        left: 50%;
        bottom: calc(30px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 45;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 14px;
        background: rgba(0, 0, 0, 0.45);
        padding: 6px 14px;
        border-radius: 20px;
        pointer-events: none;
        display: none;
      }
      #interact-hint.visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="fps-counter">-- fps</div>
      <div id="touch-controls">
        <div id="joystick-zone">
          <div id="joystick-base"></div>
          <div id="joystick-knob"></div>
        </div>
        <div id="look-zone"></div>
        <button id="interact-button" type="button">Mount</button>
      </div>
      <div id="interact-hint"></div>
      <div id="objective-panel">
        <p id="objective-hi"></p>
        <p id="objective-en"></p>
      </div>
      <div id="end-card">
        <p class="end-hi">जलेबी घर पहुँच गई!</p>
        <p class="end-en">The jalebi made it home.</p>
        <button id="play-again-btn" type="button">Play again · फिर से खेलें</button>
      </div>
      <div id="dialogue-panel">
        <p id="dialogue-hi"></p>
        <p id="dialogue-en"></p>
        <p id="dialogue-hint">Click / tap / space to continue</p>
      </div>
      <div id="start-overlay">
        <p class="title-hi">दोपहर</p>
        <p class="title-en">Dopahar</p>
        <div id="progress-track"><div id="progress-fill"></div></div>
        <p id="start-overlay-hint">Tap to start</p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
