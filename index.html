<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Dopahar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a12;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas#scene {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      /* --- Title screen --- */
      /* Warm late-afternoon gradient built from the game's own established colours —
         SKY_ZENITH_COLOR/SKY_HORIZON_COLOR (src/sky.js) at top/mid, PALETTE.mustard/
         terracotta (src/village.js) toward the bottom — not a generic template
         gradient. A soft low-sun glow and a dark flat-farmland horizon band (::after)
         echo the in-game sky without literally drawing geometry. */
      #start-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        background:
          radial-gradient(ellipse 60% 38% at 50% 76%, rgba(255, 241, 214, 0.55) 0%, rgba(255, 241, 214, 0) 70%),
          linear-gradient(to bottom, #3f6fa3 0%, #7590b4 24%, #cbb98a 54%, #f6dcae 70%, #dcc488 86%, #c98e72 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #2a1810;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        text-align: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        overflow: hidden;
      }
      #start-overlay::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 12%;
        background: linear-gradient(to bottom, rgba(74, 55, 36, 0) 0%, rgba(58, 42, 27, 0.85) 100%);
        pointer-events: none;
      }
      #start-overlay > * {
        position: relative;
        z-index: 1;
      }
      /* English primary (larger, on top), Devanagari secondary (smaller, beneath) —
         law, see CLAUDE.md. Signboards in the world are the one exception. */
      #start-overlay .title-en {
        font-size: 3rem;
        line-height: 1.2;
        margin: 0;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-shadow: 0 2px 18px rgba(74, 46, 24, 0.25);
      }
      #start-overlay .title-hi {
        font-family: 'Noto Sans Devanagari', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 1.1rem;
        opacity: 0.8;
        margin: 0.35rem 0 1.1rem;
        font-weight: 600;
      }
      #subtitle-en {
        font-size: 1.02rem;
        margin: 0;
        font-weight: 600;
        opacity: 0.88;
        letter-spacing: 0.01em;
      }
      #subtitle-hi {
        font-family: 'Noto Sans Devanagari', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 0.78rem;
        opacity: 0.68;
        margin: 0.25rem 0 2.6rem;
        font-weight: 500;
      }
      #progress-track {
        width: 200px;
        height: 4px;
        border-radius: 2px;
        background: rgba(42, 24, 16, 0.18);
        overflow: hidden;
      }
      #progress-fill {
        width: 0%;
        height: 100%;
        background: #7a3f22;
        transition: width 0.15s ease-out;
      }
      #start-overlay.hidden {
        display: none;
      }
      #play-btn {
        display: none;
        align-items: baseline;
        gap: 10px;
        margin: 0;
        font-family: inherit;
        font-weight: 700;
        color: #f8ead0;
        background: #7a3f22;
        border: none;
        border-radius: 28px;
        padding: 15px 42px;
        cursor: pointer;
        box-shadow: 0 10px 26px rgba(42, 24, 16, 0.3);
      }
      #play-btn:active {
        transform: scale(0.96);
      }
      #play-btn .play-en {
        font-size: 1.15rem;
      }
      #play-btn .play-hi {
        font-family: 'Noto Sans Devanagari', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 0.78rem;
        opacity: 0.8;
      }
      #start-overlay-hint {
        opacity: 0.7;
        font-size: 0.85rem;
        margin: 1.3rem 0 0;
        display: none;
      }
      #start-overlay.ready #progress-track {
        display: none;
      }
      #start-overlay.ready #play-btn {
        display: inline-flex;
      }
      #start-overlay.ready #start-overlay-hint {
        display: block;
      }

      /* --- FPS counter (dev flag only) --- */
      #fps-counter {
        position: fixed;
        top: calc(8px + env(safe-area-inset-top));
        left: calc(8px + env(safe-area-inset-left));
        z-index: 50;
        color: #9ee39e;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 12px;
        background: rgba(0, 0, 0, 0.4);
        padding: 4px 8px;
        border-radius: 4px;
        pointer-events: none;
        display: none;
      }

      /* --- Touch controls --- */
      #touch-controls {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: none;
        pointer-events: none;
      }
      #touch-controls.active {
        display: block;
      }
      #joystick-zone {
        position: absolute;
        left: calc(16px + env(safe-area-inset-left));
        bottom: calc(24px + env(safe-area-inset-bottom));
        width: 140px;
        height: 140px;
        pointer-events: auto;
      }
      #joystick-base {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        border: 2px solid rgba(255, 255, 255, 0.25);
      }
      #joystick-knob {
        position: absolute;
        width: 56px;
        height: 56px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.35);
      }
      #look-zone {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 50%;
        pointer-events: auto;
      }
      /* --- Objective (item 3) --- */
      #objective-panel {
        position: fixed;
        top: calc(14px + env(safe-area-inset-top));
        left: calc(14px + env(safe-area-inset-left));
        z-index: 45;
        max-width: min(62vw, 380px);
        background: rgba(20, 14, 10, 0.5);
        border-radius: 10px;
        padding: 8px 14px;
        color: #f8ead0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        pointer-events: none;
        display: none;
      }
      #objective-panel.visible {
        display: block;
      }
      #objective-en {
        font-size: 1.05rem;
        font-weight: 700;
        margin: 0;
        line-height: 1.3;
      }
      #objective-hi {
        font-family: 'Noto Sans Devanagari', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 0.72rem;
        opacity: 0.72;
        margin: 2px 0 0;
        font-weight: 600;
      }

      /* --- End card (item 3) --- */
      #end-card {
        position: fixed;
        inset: 0;
        z-index: 110;
        background: radial-gradient(ellipse at 50% 40%, #4a2e18 0%, #2a1810 60%, #1a0f0a 100%);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #f8ead0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        text-align: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #end-card.visible {
        display: flex;
      }
      #end-card .end-en {
        font-size: 2.2rem;
        line-height: 1.3;
        margin: 0;
        font-weight: 700;
      }
      #end-card .end-hi {
        font-family: 'Noto Sans Devanagari', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 1.05rem;
        opacity: 0.8;
        margin: 0.5rem 0 2rem;
        font-weight: 600;
      }
      #play-again-btn {
        font-family: inherit;
        font-size: 0.95rem;
        font-weight: 600;
        color: #2a1810;
        background: #f2b25c;
        border: none;
        border-radius: 24px;
        padding: 12px 28px;
        cursor: pointer;
      }

      /* --- Waypoint edge arrow (item 4) --- */
      #waypoint-arrow {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 42;
        width: 0;
        height: 0;
        pointer-events: none;
        display: none;
      }
      #waypoint-arrow.visible {
        display: block;
      }
      #waypoint-arrow-shape {
        width: 0;
        height: 0;
        margin: -14px 0 0 -10px;
        border-left: 10px solid transparent;
        border-right: 10px solid transparent;
        border-bottom: 16px solid rgba(242, 178, 92, 0.75);
        filter: drop-shadow(0 0 5px rgba(242, 178, 92, 0.5));
      }

      /* --- Dialogue / message panel (item 2) --- */
      #dialogue-panel {
        position: fixed;
        left: 50%;
        bottom: calc(20px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 60;
        width: min(560px, calc(100% - 32px));
        background: rgba(20, 14, 10, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 16px 20px 12px;
        color: #f8ead0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: none;
        cursor: pointer;
        pointer-events: auto;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
      }
      #dialogue-panel.visible {
        display: block;
      }
      #dialogue-en {
        font-size: 1.25rem;
        font-weight: 700;
        line-height: 1.4;
        margin: 0 0 4px;
      }
      #dialogue-hi {
        font-family: 'Noto Sans Devanagari', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 0.88rem;
        line-height: 1.35;
        opacity: 0.75;
        margin: 0;
        font-weight: 600;
      }
      #dialogue-hint {
        text-align: right;
        font-size: 0.65rem;
        opacity: 0.45;
        margin: 8px 0 0;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      /* --- Interaction prompt (item 2) — a key badge + bilingual label, centre-lower,
         doubling as the large tap target on touch. Replaces the old tiny bottom hint
         and the separate bottom-right circular tap button. --- */
      #interact-hint {
        position: fixed;
        left: 50%;
        bottom: 26vh;
        transform: translateX(-50%);
        z-index: 47;
        display: none;
        align-items: center;
        gap: 12px;
        background: rgba(20, 14, 10, 0.74);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 30px;
        padding: 8px 22px 8px 8px;
        pointer-events: none;
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.32);
      }
      #interact-hint.visible {
        display: flex;
      }
      #interact-hint.touch-target {
        pointer-events: auto;
        cursor: pointer;
        padding: 10px 26px 10px 10px;
      }
      #interact-hint.touch-target:active {
        transform: translateX(-50%) scale(0.96);
      }
      #interact-key-badge {
        flex: none;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.16);
        border: 1.5px solid rgba(255, 255, 255, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-monospace, Menlo, monospace;
        font-weight: 700;
        font-size: 1.1rem;
        color: #f8ead0;
      }
      #interact-hint.touch-target #interact-key-badge {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        font-size: 0.6rem;
        letter-spacing: 0.03em;
      }
      #interact-en {
        font-size: 1.05rem;
        font-weight: 700;
        margin: 0;
        line-height: 1.25;
        color: #f8ead0;
      }
      #interact-hi {
        font-family: 'Noto Sans Devanagari', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 0.72rem;
        opacity: 0.72;
        margin: 1px 0 0;
        font-weight: 600;
        color: #f8ead0;
      }
      @keyframes interactPulseOnce {
        0% {
          transform: translateX(-50%) scale(1);
        }
        35% {
          transform: translateX(-50%) scale(1.08);
        }
        100% {
          transform: translateX(-50%) scale(1);
        }
      }
      #interact-hint.pulse {
        animation: interactPulseOnce 0.5s ease-out;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="fps-counter">-- fps</div>
      <div id="touch-controls">
        <div id="joystick-zone">
          <div id="joystick-base"></div>
          <div id="joystick-knob"></div>
        </div>
        <div id="look-zone"></div>
      </div>
      <div id="interact-hint">
        <div id="interact-key-badge">E</div>
        <div>
          <p id="interact-en"></p>
          <p id="interact-hi"></p>
        </div>
      </div>
      <div id="waypoint-arrow"><div id="waypoint-arrow-shape"></div></div>
      <div id="objective-panel">
        <p id="objective-en"></p>
        <p id="objective-hi"></p>
      </div>
      <div id="end-card">
        <p class="end-en">The jalebi made it home.</p>
        <p class="end-hi">जलेबी घर पहुँच गई!</p>
        <button id="play-again-btn" type="button">Play again · फिर से खेलें</button>
      </div>
      <div id="dialogue-panel">
        <p id="dialogue-en"></p>
        <p id="dialogue-hi"></p>
        <p id="dialogue-hint">Click / tap / space to continue</p>
      </div>
      <div id="start-overlay">
        <p class="title-en">Dopahar</p>
        <p class="title-hi">दोपहर</p>
        <p id="subtitle-en">An afternoon in Amrai Khera</p>
        <p id="subtitle-hi">अमराई खेड़ा में एक दोपहर</p>
        <div id="progress-track"><div id="progress-fill"></div></div>
        <button id="play-btn" type="button">
          <span class="play-en">Play</span>
          <span class="play-hi">खेलें</span>
        </button>
        <p id="start-overlay-hint"></p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
