<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Dopahar</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a12;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas#scene {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      /* --- Tap to start overlay --- */
      #start-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: #0a0a12;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #f2e6d0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        text-align: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #start-overlay h1 {
        font-size: 1.6rem;
        letter-spacing: 0.08em;
        margin: 0 0 0.5rem;
        font-weight: 600;
      }
      #start-overlay p {
        opacity: 0.7;
        font-size: 0.95rem;
        margin: 0;
      }
      #start-overlay.hidden {
        display: none;
      }

      /* --- FPS counter (dev flag only) --- */
      #fps-counter {
        position: fixed;
        top: calc(8px + env(safe-area-inset-top));
        left: calc(8px + env(safe-area-inset-left));
        z-index: 50;
        color: #9ee39e;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 12px;
        background: rgba(0, 0, 0, 0.4);
        padding: 4px 8px;
        border-radius: 4px;
        pointer-events: none;
        display: none;
      }

      /* --- Touch controls --- */
      #touch-controls {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: none;
        pointer-events: none;
      }
      #touch-controls.active {
        display: block;
      }
      #joystick-zone {
        position: absolute;
        left: calc(16px + env(safe-area-inset-left));
        bottom: calc(24px + env(safe-area-inset-bottom));
        width: 140px;
        height: 140px;
        pointer-events: auto;
      }
      #joystick-base {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        border: 2px solid rgba(255, 255, 255, 0.25);
      }
      #joystick-knob {
        position: absolute;
        width: 56px;
        height: 56px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.35);
      }
      #look-zone {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 50%;
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="fps-counter">-- fps</div>
      <div id="touch-controls">
        <div id="joystick-zone">
          <div id="joystick-base"></div>
          <div id="joystick-knob"></div>
        </div>
        <div id="look-zone"></div>
      </div>
      <div id="start-overlay">
        <h1>दोपहर · Dopahar</h1>
        <p id="start-overlay-hint">Tap to start</p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
