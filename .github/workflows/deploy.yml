name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:unchecked
      # S7 budget gate (docs/s7/perf.md). build:unchecked already prints the budget report (warn).
      # STRICT FLIP DEFERRED 23 Nov (integrator decision, see docs/NEEDS_YOU.md): the old plan was to flip this
      # to `npm run budget:strict` on 24 Nov on a fixed calendar date, regardless of whether the web build was
      # still 'full' quality. It still is (her 21 Nov call, src/edition.js WEB_QUALITY), so the measured breaches
      # (downloaded-before-Play ~13 MB vs an 8 MB limit, Play-ready ~7.2s vs a 4s limit) are real today and would
      # hard-fail every deploy starting 24 Nov with nobody there to unblock it. Do NOT flip this line on a date;
      # flip it only once WEB_QUALITY moves to 'light' (or she says otherwise) - check docs/NEEDS_YOU.md first.
      - run: npm run budget  # S7-STRICT-FLIP (deferred, not date-gated - see comment above)
      - name: Licence check (warns for now; made blocking before the paid release)
        run: node tools/licence-audit.mjs --check --dist
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
