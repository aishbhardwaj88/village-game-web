# S7 desktop (21 Nov): builds the Windows installer (Setup.exe) of the DESKTOP edition on a free GitHub Windows machine.
# Runs ONLY when started by hand: GitHub > Actions > "Desktop Windows installer" > Run workflow.
# The result is attached to the run as a download ("Dopahar-windows", kept 14 days). Nothing is published or deployed.
# Unsigned for now (Windows shows a blue "Windows protected your PC" box for direct downloads; see docs/s7/desktop.md).
name: Desktop Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Install the game's tools
        run: npm ci
      - name: Licence check
        run: npm run licence:check
      - name: Build the game for desktop (full quality, original characters)
        run: npm run build:desktop
      - name: Install the desktop app tools (Electron)
        run: npm --prefix desktop ci
      - name: Make the Windows installer and zip
        run: npm --prefix desktop run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Dopahar-windows
          retention-days: 14
          if-no-files-found: error
          path: |
            desktop/out/*.exe
            desktop/out/*.zip
