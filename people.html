<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Dopahar — people test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a12;
        font-family: system-ui, sans-serif;
      }
      canvas#scene {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        top: 14px;
        left: 14px;
        color: #fff;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        z-index: 10;
      }
      #hud h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      #hud p {
        font-size: 12px;
        margin: 0;
        opacity: 0.8;
        max-width: 320px;
      }
      #toggle-btn {
        position: fixed;
        top: 14px;
        right: 14px;
        z-index: 10;
        padding: 10px 18px;
        border-radius: 8px;
        border: none;
        background: rgba(255, 255, 255, 0.92);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .label {
        position: absolute;
        transform: translate(-50%, -100%);
        text-align: center;
        color: #fff;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
        pointer-events: none;
        white-space: nowrap;
      }
      .label .en {
        font-size: 15px;
        font-weight: 700;
      }
      .label .hi {
        font-size: 12px;
        font-weight: 600;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hud">
      <h1>Dopahar — people test</h1>
      <p>Internal test page, not linked from the game. Compares the 4 code-built characters against reference art on village ground in the same afternoon light.</p>
    </div>
    <button id="toggle-btn">Toggle walk / idle</button>
    <div id="labels"></div>
    <script type="module" src="/src/peopleTest.js"></script>
  </body>
</html>
